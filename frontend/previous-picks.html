<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Önceki Maç Pickleri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap');
  :root { --blue:#1baaf0; --red:#ff4655; --gold:#c8aa6e; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding: 30px 20px 80px;
    background: #0b0e14; color:#eee;
    font-family:'Rajdhani', sans-serif;
  }
  h1 {
    font-family:'Teko', sans-serif; font-size: 30px; letter-spacing: 2px;
    text-align:center; color:var(--gold); margin-bottom: 4px;
  }
  p.sub { text-align:center; color:#888; margin-top:0; margin-bottom: 28px; font-size: 14px; }

  .game-group { max-width: 1200px; margin: 0 auto 34px; border: 1px solid #222; border-radius: 10px; overflow:hidden; background:#10141d; }
  .game-title {
    font-family:'Teko', sans-serif; font-size: 20px; letter-spacing: 3px;
    background:#161b26; padding: 10px 20px; color:#ddd;
  }
  .teams-row { display:flex; }
  .team-col { flex:1; padding: 20px; }
  .team-col.blue { border-right: 1px solid #222; }
  .team-col-title { font-family:'Teko', sans-serif; font-size: 22px; letter-spacing:1px; margin-bottom: 14px; }
  .team-col.blue .team-col-title { color: var(--blue); }
  .team-col.red .team-col-title { color: var(--red); }

  .role-row { display:flex; align-items:center; gap: 12px; margin-bottom: 10px; }
  .role-label { width: 74px; font-size: 12px; letter-spacing: 1px; color: var(--gold); text-transform:uppercase; flex-shrink:0; }
  .champ-preview {
    width: 40px; height: 40px; border-radius: 6px; background:#1c2230;
    flex-shrink:0; overflow:hidden; border:1px solid #2a3140;
  }
  .champ-preview img { width:100%; height:100%; object-fit:cover; }
  input.champ-input {
    flex:1; padding: 8px 10px; border-radius: 5px; border:1px solid #2a3140;
    background:#161b26; color:#fff; font-family:'Rajdhani', sans-serif; font-size:14px;
  }
  input.champ-input:focus { outline: 1px solid var(--gold); }

  .footer { position:fixed; bottom:0; left:0; right:0; background:#0b0e14; border-top:1px solid #222; padding:14px 20px; display:flex; justify-content:center; gap:14px; align-items:center; }
  button#saveBtn { padding: 12px 34px; background: var(--gold); border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:15px; }
  #status { font-size: 13px; color:#4caf50; min-width: 220px; }
  #status.err { color:#ff4655; }
</style>
</head>
<body>
  <h1 id="pageTitle">Önceki Maç Pickleri</h1>
  <p class="sub" id="pageSub"></p>

  <div id="groups"></div>

  <div class="footer">
    <button id="saveBtn">Kaydet ve Devam Et</button>
    <span id="status"></span>
  </div>

<script src="i18n.js"></script>
<script src="previous-picks.js"></script>
</body>
</html>
